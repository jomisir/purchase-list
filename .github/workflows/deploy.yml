# Rebuilds the planner and republishes it to GitHub Pages on every push to the
# default branch. The site is served from the `gh-pages` branch, which this
# workflow force-pushes — that branch holds build output only, never source.
#
# Published at https://jomisir.github.io/purchase-list/
#
# Why a branch rather than actions/deploy-pages: creating a Pages site through
# the API needs admin rights that the workflow token does not have, so the
# artifact-based flow cannot bootstrap itself. Pushing a branch is an ordinary
# git write, which the token can do.
name: Deploy to GitHub Pages

on:
  push:
    # gh-pages holds generated output; publishing to it must not re-trigger this.
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch is published, whatever it happens to be called.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build must never reach the phone that is relying on it.
      - run: npm test

      - run: npm run build

      - name: Prepare the published tree
        run: |
          # Stop Pages running Jekyll over the output, which would drop _-files.
          touch dist/.nojekyll
          # Serve the app for unknown paths too, so a stale deep link still works.
          cp dist/index.html dist/404.html

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
