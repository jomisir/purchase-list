# Publishes the planner to GitHub Pages, which gives it the https address a
# phone needs before it will install the app and cache it for offline use.
#
# The workflow turns Pages on by itself (`enablement: true` below), so there is
# no repository setting to change first. It deploys whenever the default branch
# is pushed, whatever that branch happens to be called, and can also be run by
# hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch is published; other branches still run nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Switches Pages on for the repository if it is not already enabled,
          # using the `pages: write` permission granted above.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
